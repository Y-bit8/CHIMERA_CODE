name: paper-repro-check
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10.20
  - pip
  - rdkit=2026.03.1
  - numpy=1.26.4
  - pandas=2.3.3
  - scikit-learn=1.7.2
  - tqdm=4.67.3
  - pyyaml=6.0.3
  - matplotlib=3.10.9
  - seaborn=0.13.2
  - openpyxl=3.1.5

  - pip:
      - --index-url https://pypi.org/simple
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - --find-links https://data.pyg.org/whl/torch-2.1.2+cu118.html
      - torch==2.1.2+cu118
      - pyg-lib==0.4.0+pt21cu118
      - torch-scatter==2.1.2+pt21cu118
      - torch-sparse==0.6.18+pt21cu118
      - torch-cluster==1.6.3+pt21cu118
      - torch-spline-conv==1.2.2+pt21cu118
      - torch-geometric==2.7.0
